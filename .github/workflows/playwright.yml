name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      API_BASE_URL: http://localhost:4000/api/v1/
      BASE_URL: http://localhost:4000/
      NEW_USER_PASSWORD: ${{ secrets.NEW_USER_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start Maison
        run: docker run -d --rm --name maison -p 4000:4000 youvegotnigel/maison:latest

      - name: Wait for Maison
        run: npx wait-on http://localhost:4000/api/v1/health --timeout 60000

      - name: Run API tests
        run: npm run test:api
        env:
          API_BASE_URL: http://localhost:4000/api/v1/
          BASE_URL: http://localhost:4000/
          NEW_USER_PASSWORD: ${{ secrets.NEW_USER_PASSWORD }}

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          API_BASE_URL: http://localhost:4000/api/v1/
          BASE_URL: http://localhost:4000/
          NEW_USER_PASSWORD: ${{ secrets.NEW_USER_PASSWORD }}

      - name: Run UI tests
        run: npm run test:ui
        env:
          API_BASE_URL: http://localhost:4000/api/v1/
          BASE_URL: http://localhost:4000/
          NEW_USER_PASSWORD: ${{ secrets.NEW_USER_PASSWORD }}

      - name: Stop Maison
        if: always()
        run: docker stop maison

  performance:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      API_BASE_URL: http://localhost:4000/api/v1/
      BASE_URL: http://localhost:4000/
      # NEW_USER_PASSWORD not needed

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Start Maison
        run: docker run -d --rm --name maison -p 4000:4000 youvegotnigel/maison:latest

      - name: Wait for Maison
        run: npx wait-on http://localhost:4000/api/v1/health --timeout 60000

      - name: Install k6
        run: |
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Run performance smoke test
        run: npm run perf:smoke
        env:
          API_BASE_URL: http://localhost:4000/api/v1/
          BASE_URL: http://localhost:4000/
          # NEW_USER_PASSWORD not needed

      - name: Stop Maison
        if: always()
        run: docker stop maison